name: Build Kiwi APK (Standalone)

on:
  workflow_dispatch:
    inputs:
      target_cpu:
        description: 'Target architecture'
        required: true
        default: 'arm64'
        type: choice
        options:
          - arm64
          - arm
          - x64
          - x86

jobs:
  build:
    # 建议使用 16核+ / 32GB+ 内存 / 150GB+ SSD 的自托管 Runner（或大规格主机）
    runs-on: self-hosted
    env:
      CHROMIUM_DIR: ${{ github.workspace }}/chromium
      CHROMIUM_TAG: '105.0.5195.24'

    steps:
      - name: Checkout Kiwi overlay repo
        uses: actions/checkout@v4
        with:
          path: kiwi-overlay

      - name: Install depot_tools
        run: |
          if [ ! -d "${{ github.workspace }}/depot_tools" ]; then
            git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git "${{ github.workspace }}/depot_tools"
          fi
          echo "${{ github.workspace }}/depot_tools" >> $GITHUB_PATH

      - name: Sync Chromium ${{ env.CHROMIUM_TAG }} source
        run: |
          mkdir -p "$CHROMIUM_DIR"
          cd "$CHROMIUM_DIR"
          if [ ! -d "src" ]; then
            fetch --nohooks android
          fi
          cd src
          git fetch --tags origin
          git checkout -f "tags/${{ env.CHROMIUM_TAG }}"
          gclient sync -D --with_branch_heads --with_tags --nohooks

      - name: Overlay Kiwi files onto Chromium src
        run: |
          rsync -a --exclude='.git' --exclude='.github' --exclude='.build' \
            "${{ github.workspace }}/kiwi-overlay/" "$CHROMIUM_DIR/src/"

      - name: Install build dependencies and run hooks
        run: |
          cd "$CHROMIUM_DIR/src"
          sudo ./build/install-build-deps.sh --no-prompt --android
          gclient runhooks

      - name: Generate keystore and configure args.gn
        run: |
          OUT_DIR="$CHROMIUM_DIR/src/out/android_${{ inputs.target_cpu }}"
          mkdir -p "$OUT_DIR"
          if [ ! -f "$CHROMIUM_DIR/src/keystore.jks" ]; then
            keytool -genkey -v -keystore "$CHROMIUM_DIR/src/keystore.jks" \
              -alias dev -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass public_password -keypass public_password \
              -dname "cn=Kiwi Browser, ou=Actions, o=Kiwi, c=GitHub"
          fi
          cp "${{ github.workspace }}/kiwi-overlay/.build/production_build_reference/args.gn" "$OUT_DIR/args.gn"
          sed -i 's/^target_cpu = .*/target_cpu = "${{ inputs.target_cpu }}"/' "$OUT_DIR/args.gn"
          sed -i 's/^cc_wrapper = .*/# cc_wrapper disabled/' "$OUT_DIR/args.gn"

      - name: Build APK with gn and autoninja
        run: |
          cd "$CHROMIUM_DIR/src"
          OUT_REL="out/android_${{ inputs.target_cpu }}"
          gn gen "$OUT_REL"
          autoninja -C "$OUT_REL" chrome_public_apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kiwi-${{ inputs.target_cpu }}-apk
          path: ${{ env.CHROMIUM_DIR }}/src/out/android_${{ inputs.target_cpu }}/apks/ChromePublic.apk
